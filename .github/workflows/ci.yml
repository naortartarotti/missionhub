name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database:
    name: Integration, E2E, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci

      - name: Start local Supabase (applies all migrations)
        run: npm run db:start

      - name: Write .env.local from the local stack (throwaway CI keys)
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "APP_ENV=test"
          } > .env.local

      - name: Generated DB types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u src/server/db/database.types.ts /tmp/database.types.ts

      - name: Integration tests (RLS, RPCs, ledger)
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (builds, starts web + worker)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
